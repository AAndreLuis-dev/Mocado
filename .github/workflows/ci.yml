name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter extension lint:firefox
      - run: pnpm --filter extension exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm zip
      - uses: actions/upload-artifact@v4
        with:
          name: mocado-zips
          path: apps/extension/.output/*.zip
